services:
  - type: web
    name: daily-speaking-coach-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: REQUIRE_HTTPS
        value: "true"
      - key: MAX_FILE_SIZE_BYTES
        value: "12582912"
      - key: MAX_AUDIO_DURATION_SECONDS
        value: "75"
      - key: MAX_DAILY_ANALYSES_PER_USER
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"
